<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Control - Union Group Security</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="access-control">
    <nav>
        <h2>Union <span class="brand-accent">Security</span></h2>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="visitor-registration.html">Register Visitor</a>
            <a href="access-control.html" class="is-active">Access Control</a>
            <a href="incident-report.html">Report Incident</a>
            <a href="login.html" class="btn btn-danger btn-nav" data-logout>Logout</a>
        </div>
    </nav>

    <div class="container animate-fade page-shell">
        <div id="accessMessage" class="alert alert-success hidden"></div>

        <div class="dashboard-grid split-grid">
            <div class="glass-panel">
                <h3>Record Visitor Entry</h3>
                <form class="stacked-form" id="entryForm">
                    <div class="form-group">
                        <label for="visitorId">Select Visitor</label>
                        <select id="visitorId" name="visitorId" required></select>
                    </div>

                    <div class="form-group">
                        <label for="employeeId">Host Employee</label>
                        <select id="employeeId" name="employeeId" required>
                            <option value="">Select host employee</option>
                            <option>Mary Wanjiku (Operations)</option>
                            <option>Brian Ouma (IT)</option>
                            <option>Kevin Langat (Finance)</option>
                            <option>Joan Naliaka (Human Resources)</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary full-width">Record Entry</button>
                </form>
            </div>

            <div class="glass-panel">
                <h3>Record Visitor Exit</h3>
                <form class="stacked-form" id="exitForm">
                    <div class="form-group">
                        <label for="exitVisitorId">Select Visitor</label>
                        <select id="exitVisitorId" name="visitorId" required></select>
                    </div>

                    <button type="submit" class="btn btn-primary full-width">Record Exit</button>
                </form>
            </div>
        </div>

        <div class="glass-panel">
            <h3>Access Logs</h3>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Visitor</th>
                        <th>Host Employee</th>
                        <th>Entry Time</th>
                        <th>Exit Time</th>
                        <th>Recorded By</th>
                    </tr>
                </thead>
                <tbody id="accessTable"></tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
