<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit History - Union Group Security</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="audit-history">
    <nav>
        <h2>Union <span class="brand-accent">Security</span></h2>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="users.html">User Management</a>
            <a href="employees.html">Employee Management</a>
            <a href="reports.html">Reports</a>
            <a href="audit-history.html" class="is-active">Audit History</a>
            <a href="visitor-registration.html">Register Visitor</a>
            <a href="access-control.html">Access Control</a>
            <a href="incident-report.html">Report Incident</a>
            <a href="login.html" class="btn btn-danger btn-nav" data-logout>Logout</a>
        </div>
    </nav>

    <div class="container animate-fade page-shell">
        <div class="glass-panel form-panel">
            <h2>Audit History</h2>
            <p class="muted-block">Review who made system changes, what they changed, and when it happened.</p>
            <div id="auditMessage" class="alert alert-success hidden"></div>

            <form class="stacked-form" id="auditForm">
                <div class="dashboard-grid">
                    <div class="form-group">
                        <label for="auditStartDate">Start Date</label>
                        <input type="date" id="auditStartDate" required>
                    </div>

                    <div class="form-group">
                        <label for="auditEndDate">End Date</label>
                        <input type="date" id="auditEndDate" required>
                    </div>
                </div>

                <div class="inline-actions">
                    <button type="submit" class="btn btn-primary">Load Audit History</button>
                    <button type="button" class="btn btn-secondary" id="exportAuditHistory">Export CSV</button>
                </div>
            </form>
        </div>

        <div class="glass-panel top-gap">
            <h3>Audit Entries</h3>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Action</th>
                        <th>Entity</th>
                        <th>Entity ID</th>
                        <th>User</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody id="auditTable"></tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
