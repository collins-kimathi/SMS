<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Union Group Security</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
    <div class="center-layout page-shell">
        <div class="glass-panel animate-fade auth-card">
            <p class="eyebrow">Security Management System</p>
            <h1 class="hero-title">Union Security</h1>
            <p class="hero-copy">Sign in to manage visitor registration, access activity, and incident reporting from one workspace.</p>

            <div id="loginMessage" class="alert alert-success hidden">
                Session ready.
            </div>

            <form class="stacked-form" id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary full-width">Sign In</button>
            </form>

            <p class="footer-note">Union Group Security Operations © 2026</p>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
