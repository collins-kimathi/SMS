<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Union Group Security</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reports">
    <nav>
        <h2>Union <span class="brand-accent">Security</span></h2>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="users.html">User Management</a>
            <a href="reports.html" class="is-active">Reports</a>
            <a href="visitor-registration.html">Register Visitor</a>
            <a href="access-control.html">Access Control</a>
            <a href="incident-report.html">Report Incident</a>
            <a href="login.html" class="btn btn-danger btn-nav" data-logout>Logout</a>
        </div>
    </nav>

    <div class="container animate-fade page-shell">
        <div class="glass-panel form-panel">
            <h2>Access Reports</h2>
            <p class="muted-block">Filter access logs by visit date to generate a simple operational report.</p>
            <div id="reportMessage" class="alert alert-success hidden"></div>

            <form class="stacked-form" id="reportForm">
                <div class="dashboard-grid">
                    <div class="form-group">
                        <label for="reportStartDate">Start Date</label>
                        <input type="date" id="reportStartDate" required>
                    </div>

                    <div class="form-group">
                        <label for="reportEndDate">End Date</label>
                        <input type="date" id="reportEndDate" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary full-width">Generate Report</button>
            </form>
        </div>

        <div class="glass-panel top-gap">
            <h3>Report Results</h3>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Visitor</th>
                        <th>Host</th>
                        <th>Entry</th>
                        <th>Exit</th>
                        <th>Recorded By</th>
                    </tr>
                </thead>
                <tbody id="reportsTable"></tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
