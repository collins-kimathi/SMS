<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Union Group Security</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="notifications">
    <nav>
        <h2>Union <span class="brand-accent">Security</span></h2>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="users.html">User Management</a>
            <a href="employees.html">Employee Management</a>
            <a href="subsidiaries.html">Subsidiaries</a>
            <a href="cctv-monitoring.html">CCTV Monitoring</a>
            <a href="reports.html">Reports</a>
            <a href="audit-history.html">Audit History</a>
            <a href="visitor-registration.html">Register Visitor</a>
            <a href="access-control.html">Access Control</a>
            <a href="incident-report.html">Report Incident</a>
            <a href="notifications.html" class="is-active">Notifications</a>
            <a href="login.html" class="btn btn-danger btn-nav" data-logout>Logout</a>
        </div>
    </nav>
    <div class="container animate-fade page-shell">
        <h1>Notifications</h1>
        <div class="glass-panel">
            <table>
                <thead><tr><th>Title</th><th>Message</th><th>Severity</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="notificationTable"></tbody>
            </table>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        async function renderNotifications() {
            const rows = await api("/api/notifications");
            const tbody = document.getElementById("notificationTable");
            tbody.innerHTML = rows.map(r => `<tr>
                <td>${escapeHtml(r.title)}</td>
                <td>${escapeHtml(r.message)}</td>
                <td>${escapeHtml(r.severity)}</td>
                <td>${r.isRead ? "Read" : "Unread"}</td>
                <td>${r.isRead ? "" : `<button onclick="markRead(${r.id})">Mark Read</button>`}</td>
            </tr>`).join("") || tableEmptyRow(5, "No notifications found.");
        }
        async function markRead(id) {
            await api("/api/notifications/read", { method: "POST", headers: {"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"}, body: formBody({ notificationId: id }) });
            await renderNotifications();
        }
        renderNotifications();
    </script>
</body>
</html>
